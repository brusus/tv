name: Heal Domains

# Controlla se i siti dei provider hanno cambiato dominio (redirect) e, in caso,
# aggiorna i sorgenti, alza la versione dei moduli e committa. Poi lancia la
# build per rigenerare i .cs3. Gira ogni ora e a mano.

on:
  schedule:
    - cron: "43 * * * *"   # ogni ora, al minuto 43
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: heal-domains
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rileva e applica i domini spostati
        run: bash scripts/heal-domains.sh

      - name: Committa e lancia la build se qualcosa e' cambiato
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nessuna modifica: niente da fare."
            exit 0
          fi
          SUMMARY=$(cat .heal-summary.txt 2>/dev/null || echo "domini aggiornati")
          rm -f .heal-summary.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Heal domains: aggiorna i domini spostati" -m "$SUMMARY"
          git push
          echo "Lancio la build per rigenerare i .cs3..."
          gh workflow run build.yml || echo "NB: non sono riuscito a lanciare la build; lanciala a mano da Actions."
